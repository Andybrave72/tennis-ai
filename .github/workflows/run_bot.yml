name: Aggiorna Bot Tennis

on:
  schedule:
    - cron: '0 7 * * *' # Gira ogni giorno alle 07:00 UTC
  workflow_dispatch: # Ti permette di avviarlo manualmente con un click quando vuoi

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installa dipendenze
        run: |
          pip install pandas numpy scikit-learn requests

      - name: Esegui il bot
        run: |
          python aggiorna_bot.py
